name: "Bug report"
description: "Report a problem with CoCo Max Online."
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve CoCo Max Online! Please include enough detail for me to reproduce the problem. Do not include passwords or other sensitive information.
  - type: textarea
    id: description
    attributes:
      label: What went wrong?
      description: Describe the problem you encountered.
      placeholder: "Example: The fill tool stops working after switching to artifact color mode."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps to make the problem happen.
      placeholder: |
        1. Open CoCo Max Online
        2. Select ...
        3. Click ...
        4. See the problem
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Google Chrome
        - Microsoft Edge
        - Mozilla Firefox
        - Safari
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Example: Windows 11, macOS, Linux, iOS, Android"
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Drag and drop images here if they help explain the problem.
  - type: textarea
    id: notes
    attributes:
      label: Additional information
      description: Include anything else that may help reproduce or diagnose the issue.
