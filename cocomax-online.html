/* ===================== Resize (with algorithms) ===================== */
/* Resize the whole image's content. The CoCo page stays 256x192; we cannot
   exceed that, so target dims are clamped to <=256x192. Algorithms:
   nearest (blocky), bilinear-threshold (smooth then 50% threshold),
   and area-average-threshold (good for downscaling).                      */
function resizeImage(tw, th, algo){
  tw=Math.max(1,Math.min(W,tw|0)); th=Math.max(1,Math.min(H,th|0));
  pushUndo();
  // determine current content bounds across all layers (union of masks)
  layers.forEach(L=>{
    const nb=new Uint8Array(W*H), nm=new Uint8Array(W*H);
    for(let dy=0;dy<th;dy++)for(let dx=0;dx<tw;dx++){
      const fx=dx*(W/tw), fy=dy*(H/th);
      let lit, on;
      if(algo==='nearest'){
        const sx=Math.min(W-1,fx|0), sy=Math.min(H-1,fy|0), si=sy*W+sx;
        on=L.mask[si]; lit=L.bmp[si];
      } else {
        // sample a box and average (covers bilinear-ish + area)
        const x0=fx|0, y0=fy|0, x1=Math.min(W-1,Math.ceil((dx+1)*(W/tw))-1), y1=Math.min(H-1,Math.ceil((dy+1)*(H/th))-1);
        let sumLit=0,sumOn=0,n=0;
        for(let yy=y0;yy<=Math.max(y0,y1);yy++)for(let xx=x0;xx<=Math.max(x0,x1);xx++){ const si=yy*W+xx; if(L.mask[si]){sumOn++; sumLit+=L.bmp[si];} n++; }
        on=sumOn> (n/2)?1:(sumOn>0?1:0);
        lit=(sumOn>0 && sumLit*2>=sumOn)?1:0;
      }
      const di=dy*W+dx; nb[di]=lit; nm[di]=on;
    }
    L.bmp=nb; L.mask=nm;
  });
  selRect=null; selMask=null;
  render(); buildLayerList();
}
function showResizeDialog(){
  showModal(`<h3>Resize Image</h3>
    <div style="font-size:12px;color:#444;max-width:360px">Maximum size is 256 × 192 (one CoCo PMODE 4 page). Larger values are clamped.</div>
    <label class="fld">Width: <input class="txt" id="rw" type="number" min="1" max="256" value="${W}" style="width:80px"> px</label>
    <label class="fld">Height: <input class="txt" id="rh" type="number" min="1" max="192" value="${H}" style="width:80px"> px</label>
    <label class="fld">Algorithm:
      <select class="txt" id="ralgo">
        <option value="nearest">Nearest neighbor (blocky)</option>
        <option value="bilinear">Bilinear + threshold (smooth)</option>
        <option value="area">Area average + threshold (best downscale)</option>
      </select></label>
    <div class="row"><button class="btn" id="c">Cancel</button><button class="btn default" id="ok">Resize</button></div>`);
  document.getElementById('c').onclick=closeModal;
  document.getElementById('ok').onclick=()=>{
    let tw=+document.getElementById('rw').value, th=+document.getElementById('rh').value;
    const algo=document.getElementById('ralgo').value;
    if(tw>W||th>H){ tw=Math.min(W,tw); th=Math.min(H,th); }
    resizeImage(tw,th,algo); closeModal();
  };
}

/* ===================== Goodies actions ===================== */
function invertLayer(){ const L=curLayer(); for(let i=0;i<W*H;i++){ if(L.mask[i]) L.bmp[i]=L.bmp[i]?0:1; } }
function fillLayer(){ const L=curLayer(); const r=selRect?normRect(selRect):{x0:0,y0:0,x1:W-1,y1:H-1}; for(let y=r.y0;y<=r.y1;y++)for(let x=r.x0;x<=r.x1;x++){const i=y*W+x;L.bmp[i]=patBit(x,y);L.mask[i]=1;} }
function flipH(){ const L=curLayer(); for(const A of [L.bmp,L.mask]) for(let y=0;y<H;y++)for(let x=0;x<W/2;x++){const i=y*W+x,j=y*W+(W-1-x);const t=A[i];A[i]=A[j];A[j]=t;} }
function flipV(){ const L=curLayer(); for(const A of [L.bmp,L.mask]) for(let y=0;y<H/2;y++)for(let x=0;x<W;x++){const i=y*W+x,j=(H-1-y)*W+x;const t=A[i];A[i]=A[j];A[j]=t;} }
function rot180(){ const L=curLayer(); for(const A of [L.bmp,L.mask]) A.reverse(); }
function traceEdges(){ const L=curLayer(); const src=L.bmp.slice(),sm=L.mask.slice(); for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;let edge=0;if(sm[i]&&src[i]){const n=[[x-1,y],[x+1,y],[x,y-1],[x,y+1]];for(const[nx,ny]of n){if(!inb(nx,ny)|| !sm[ny*W+nx] || !src[ny*W+nx]){edge=1;break;}}}L.bmp[i]=edge;L.mask[i]=edge||sm[i]?1:L.mask[i];if(!edge&&src[i])L.bmp[i]=0;} }

function editPattern(){
  let tile=curPattern.slice();
  // Convention: bit 1 = lit pixel. A lit pixel at an even column reads as blue,
  // at an odd column as orange; two adjacent lit pixels read white; all-off is
  // solid black. Each editor cell shows the color it would actually produce.
  function cellColor(x,y){
    const on=(tile[y]>>(7-x))&1;
    if(!on) return '#000';
    const leftOn  = x>0 ? (tile[y]>>(7-(x-1)))&1 : 0;
    const rightOn = x<7 ? (tile[y]>>(7-(x+1)))&1 : 0;
    if(leftOn||rightOn) return 'rgb(236,236,236)';            // white (paired)
    // lone lit pixel: even col -> blue, odd col -> orange
    return (x&1)===0 ? 'rgb(40,70,210)' : 'rgb(232,120,28)';
  }
  function grid(){
    let s='';
    for(let y=0;y<8;y++)for(let x=0;x<8;x++){
      s+=`<div data-x="${x}" data-y="${y}" style="width:22px;height:22px;border:1px solid #888;background:${cellColor(x,y)}"></div>`;
    }
    return s;
  }
  showModal(`<h3>Edit Pattern</h3>
    <div style="font-size:11px;color:#555;max-width:340px;margin-bottom:6px">Click a cell to toggle a lit pixel. A lone pixel shows blue (even column) or orange (odd column); two side-by-side show white; all-off is solid black — just like the CoCo artifact display.</div>
    <div style="display:flex;gap:16px;align-items:center">
    <div id="pe" style="display:grid;grid-template-columns:repeat(8,22px);grid-auto-rows:22px;background:#000;padding:2px"></div>
    <img id="peprev" style="width:80px;height:80px;border:2px solid #000;image-rendering:pixelated">
   </div><div class="row"><button class="btn" id="c">Cancel</button><button class="btn default" id="ok">OK</button></div>`);
  const pe=document.getElementById('pe'); const prev=document.getElementById('peprev');
  function refresh(){ pe.innerHTML=grid(); prev.src=tileURL(tile,8); pe.querySelectorAll('div').forEach(d=>d.onclick=()=>{const x=+d.dataset.x,y=+d.dataset.y;tile[y]^=(1<<(7-x));refresh();}); }
  refresh();
  document.getElementById('c').onclick=closeModal;
  document.getElementById('ok').onclick=()=>{ curPattern=tile.slice(); curPatternIndex=-1; drawCurPat(); buildPalette(); closeModal(); };
}

/* ===================== Action dispatch ===================== */
function applyZoom(){ document.getElementById('zoomlabel').textContent=Math.round(SCALE/3*100)+'%'; sizeCanvas(); render(); }
function doAction(a){
  switch(a){
    case 'new': initLayers(); setTitle('untitled'); buildLayerList(); render(); break;
    case 'open': actionOpen(); break;
    case 'savejson': saveJSON(); break;
    case 'savepng': savePNG(); break;
    case 'savemax': saveMAX(); break;
    case 'savebin': saveBIN(); break;
    case 'saverle': saveRLE(); break;
    case 'saveasm': saveASM(); break;
    case 'saveas': showSaveAsDialog(); break;
    case 'createdsk': createBlankDsk(); break;
    case 'savedsk': saveDSK(); break;
    case 'opendsk': actionOpen(); break;
    case 'undo': doUndo(); break;
    case 'redo': doRedo(); break;
    case 'cut': doCut(); updateEditMenu(); break;
    case 'copy': doCopy(); break;
    case 'paste': doPaste(); break;
    case 'clear': if(selRect||selMask){pushUndo();clearSelectionArea();render();} break;
    case 'selall': selMask=null; selRect={x0:0,y0:0,x1:W-1,y1:H-1}; updateEditMenu(); render(); break;
    case 'selinv': invertSelection(); break;
    case 'deselect': deselect(); break;
    case 'grid': gridOn=!gridOn; buildMenu('goodies',MENUS.goodies); render(); break;
    case 'rulers': rulersOn=!rulersOn; buildMenu('goodies',MENUS.goodies); render(); break;
    case 'resize': showResizeDialog(); break;
    case 'cropsel': if(selRect){ applyCrop(); } else { flash('Make a selection first, then Crop to Selection.'); } break;
    case 'fatbits': fatBits=!fatBits; if(fatBits){fbOX=Math.max(0,Math.min(W-fbCols,(selRect?normRect(selRect).x0:W/2-fbCols/2)|0));fbOY=Math.max(0,Math.min(H-fbRows,(selRect?normRect(selRect).y0:H/2-fbRows/2)|0));} document.getElementById('fatbtn').classList.toggle('on',fatBits); buildMenu('goodies',MENUS.goodies); render(); break;
    case 'showpage': SCALE=3; applyZoom(); break;
    case 'editpat': editPattern(); break;
    case 'invert': pushUndo(); invertLayer(); render(); break;
    case 'fill': pushUndo(); fillLayer(); render(); break;
    case 'trace': pushUndo(); traceEdges(); render(); break;
    case 'fliph': pushUndo(); flipH(); render(); break;
    case 'flipv': pushUndo(); flipV(); render(); break;
    case 'rot': pushUndo(); rot180(); render(); break;
    case 'remap': showMappingDialog(false); break;
  }
}

/* keyboard shortcuts */
document.addEventListener('keydown',e=>{
  if(e.target===textInput) return;
  const k=e.key.toLowerCase();
  // Fat Bits panning with arrow keys
  if(fatBits && ['arrowleft','arrowright','arrowup','arrowdown'].includes(k)){
    e.preventDefault();
    const step=e.shiftKey?8:2;
    if(k==='arrowleft')  fbOX=Math.max(0, fbOX-step);
    if(k==='arrowright') fbOX=Math.min(W-fbCols, fbOX+step);
    if(k==='arrowup')    fbOY=Math.max(0, fbOY-step);
    if(k==='arrowdown')  fbOY=Math.min(H-fbRows, fbOY+step);
    render(); return;
  }
  if(e.metaKey||e.ctrlKey){
    if(k==='z'&&e.shiftKey){e.preventDefault();doRedo();}
    else if(k==='z'){e.preventDefault();doUndo();}
    else if(k==='y'){e.preventDefault();doRedo();}
    else if(k==='x'){e.preventDefault();doCut();}
    else if(k==='c'){e.preventDefault();doCopy();}
    else if(k==='v'){e.preventDefault();doPaste();}
    else if(k==='a'){e.preventDefault();doAction('selall');}
    else if(k==='i'&&e.shiftKey){e.preventDefault();doAction('selinv');}
    else if(k==='d'){e.preventDefault();doAction('deselect');}
    else if(k==='o'){e.preventDefault();actionOpen();}
    else if(k==='s'){e.preventDefault();showSaveAsDialog();}
    else if(k==='e'){e.preventDefault();doAction('trace');}
  }
});

/* ===================== Floating window dragging ===================== */
function makeDraggable(win){
  const bar=win.querySelector('.titlebar'); if(!bar)return;
  bar.addEventListener('pointerdown',e=>{
    if(e.target.classList.contains('closebox'))return;
    document.querySelectorAll('.win').forEach(w=>w.classList.remove('focused')); win.classList.add('focused');
    const r=win.getBoundingClientRect(); const ox=e.clientX-r.left, oy=e.clientY-r.top;
    win.style.right='auto'; win.style.bottom='auto';
    function mv(ev){ win.style.left=Math.max(0,ev.clientX-ox)+'px'; win.style.top=Math.max(26,ev.clientY-oy)+'px'; }
    function up(){ document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up); }
    document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
  });
  win.addEventListener('pointerdown',()=>{ document.querySelectorAll('.win').forEach(w=>w.classList.remove('focused')); win.classList.add('focused'); });
}
document.querySelectorAll('.closebox').forEach(cb=>cb.onclick=(e)=>{
  e.stopPropagation();
  const which=cb.dataset.close;
  if(which==='disk'){ document.getElementById('diskwin').classList.add('hidden'); buildWindowsMenu(); return; }
  // hide the parent window (doc included now); reachable again via Windows menu
  const win=cb.closest('.win'); if(win){ win.classList.add('hidden'); buildWindowsMenu(); }
});

/* zoom & display buttons */
document.getElementById('zoomin').onclick=()=>{ SCALE=Math.min(9,SCALE+1); applyZoom(); };
document.getElementById('zoomout').onclick=()=>{ SCALE=Math.max(1,SCALE-1); applyZoom(); };
document.getElementById('fatbtn').onclick=()=>doAction('fatbits');
document.getElementById('dispbtn').onclick=()=>{ dispMode=dispMode==='composite'?'rgb':'composite'; document.getElementById('dispbtn').textContent=dispMode==='composite'?'Composite':'RGB'; render(); };
document.getElementById('ntscbtn').onclick=()=>{ ntscFringe=!ntscFringe; document.getElementById('ntscbtn').classList.toggle('on',ntscFringe); buildPalette(); drawCurPat(); render(); };
document.getElementById('cssbtn').onclick=()=>{ cssBit=cssBit?0:1; document.getElementById('cssbtn').textContent='CSS '+cssBit; render(); };
document.getElementById('lnew').onclick=addLayer;
document.getElementById('lmerge').onclick=mergeDown;
document.getElementById('ldup').onclick=dupLayer;
document.getElementById('ldel').onclick=delLayer;
/* disk gallery buttons */
document.getElementById('dkload').onclick=diskLoadSelected;
document.getElementById('dksave').onclick=diskSaveCurrent;
document.getElementById('dkdup').onclick=diskDuplicateSelected;
document.getElementById('dkdel').onclick=diskDeleteSelected;
document.getElementById('dkdownload').onclick=diskDownload;

/* ===================== Boot ===================== */
/* Pixel-exact artifact-stripe desktop: alternating 1px orange and 1px blue
   scanlines (no black gaps), rendered as a 1x2 tile shown at 1:1 so each line
   is exactly one pixel. No moire/diagonal seam. */
function setDesktopBackground(){
  const tw=1, th=2;
  const c=document.createElement('canvas'); c.width=tw; c.height=th;
  const x=c.getContext('2d'); const id=x.createImageData(tw,th);
  const O=COL.orange, B=COL.blue;
  const rows=[O,B];
  for(let y=0;y<th;y++){ const col=rows[y]; const i=y*4; id.data[i]=col[0];id.data[i+1]=col[1];id.data[i+2]=col[2];id.data[i+3]=255; }
  x.putImageData(id,0,0);
  const url=c.toDataURL();
  const d=document.getElementById('desktop');
  d.style.backgroundImage=`url(${url})`;
  d.style.backgroundSize=`1px 2px`;   /* exactly 1px orange + 1px blue, no scaling */
  d.style.imageRendering='pixelated';
}

function boot(){
  initLayers();
  sizeCanvas();
  setDesktopBackground();
  buildToolbox(); buildPalette(); drawCurPat();
  buildMenu('file',MENUS.file); buildMenu('edit',MENUS.edit); buildMenu('goodies',MENUS.goodies);
  buildFontMenu(); buildStyleMenu(); buildWindowsMenu(); buildAboutMenu();
  buildLayerList();
  ['toolbox','docwin','layerwin','patwin','diskwin','previewwin'].forEach(id=>makeDraggable(document.getElementById(id)));
  curPattern=PALETTE[1].slice(); curPatternIndex=1;   /* id 2 = Solid Black */
  render();
  // Lay out the floating windows: Layers and Preview right-aligned (disk
  // gallery stays hidden until a disk is mounted).
  document.getElementById('diskwin').classList.add('hidden');
  resetWindowPositions();
}
boot();
window.addEventListener('resize', ()=>{ /* keep right-aligned windows pinned */
  const lw=document.getElementById('layerwin'); if(lw && lw.style.right){ /* already right-anchored, CSS handles it */ }
});

</script>
